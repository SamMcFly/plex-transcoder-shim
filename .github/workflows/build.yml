name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: .\scripts\Build.ps1

      - name: Test argument rewriting
        shell: pwsh
        run: .\tests\Test-Rewrite.ps1

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlexTranscoderShim-windows-x64-unsigned
          path: |
            dist/PlexTranscoderShim.exe
            dist/shim.ini
          if-no-files-found: error
