name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        shell: pwsh
        run: .\scripts\Build.ps1

      - name: Test argument rewriting
        shell: pwsh
        run: .\tests\Test-Rewrite.ps1

      - name: Test process forwarding and cleanup
        shell: pwsh
        run: .\tests\Test-EndToEnd.ps1

      - name: Test install, repair, and rollback lifecycle
        shell: pwsh
        run: .\tests\Test-Management.ps1

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PlexTranscoderShim-windows-x64-unsigned
          path: |
            dist/PlexTranscoderShim.exe
            dist/shim.ini
          if-no-files-found: error
